version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: restaurant-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/processed/qdrant_storage:/qdrant/storage

  # Optional: run Ollama in Docker too instead of installing it natively.
  # If you already run `ollama serve` natively, delete this service and
  # keep OLLAMA_BASE_URL=http://localhost:11434 in .env
  ollama:
    image: ollama/ollama:latest
    container_name: restaurant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/processed/ollama_models:/root/.ollama
    # uncomment for GPU passthrough (needs nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
